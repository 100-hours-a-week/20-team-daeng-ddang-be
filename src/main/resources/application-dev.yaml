spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

springdoc:
  api-docs:
    enabled: true
    path: /api/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/swagger-ui.html
    try-it-out-enabled: false

logging:
  level:
    root: INFO
#    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

ratelimit:
  enabled: false
ranking:
  batch:
    enabled: true
    cron: "0 */30 * * * *"
    cleanup-cron: "0 */30 * * * *"
    retention-cron: "0 */30 * * * *"
