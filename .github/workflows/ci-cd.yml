name: BE CI/CD

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main", "dev"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: be-ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_ID: ${{ github.sha }}
  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
  MESSAGE: >-
    ${{
      github.event.pull_request.title ||
      github.event.head_commit.message ||
      github.workflow
    }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Mark CI start
        id: ci_time
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Test
        id: time_test
        run: |
          start=$(date +%s)
          # ./gradlew clean test --no-daemon
          end=$(date +%s)
          echo "start=${start}" >> "$GITHUB_OUTPUT"
          echo "end=${end}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (push only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        id: time_build
        run: |
          start=$(date +%s)
          docker build -t "${{ env.DOCKER_IMAGE }}:${{ env.RELEASE_ID}}" .
          end=$(date +%s)
          echo "start=${start}" >> "$GITHUB_OUTPUT"
          echo "end=${end}" >> "$GITHUB_OUTPUT"

      - name: Push (push only)
        if: github.event_name == 'push'
        run: |
          docker push "${{ env.DOCKER_IMAGE }}:${{ env.RELEASE_ID}}"

      - name: Mark CI end
        id: ci_time_end
        if: always()
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Notify
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE: ${{ env.MESSAGE }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ENV_NAME: >-
            ${{
              (github.event_name == 'pull_request' && github.base_ref == 'main') && 'prod' ||
              (github.event_name == 'pull_request') && 'dev' ||
              (github.ref_name == 'main' && 'prod') ||
              'dev'
            }}

          CI_START: ${{ steps.ci_time.outputs.start }}
          CI_END: ${{ steps.ci_time_end.outputs.end }}

          TEST_S: ${{ steps.time_test.outputs.start }}
          TEST_E: ${{ steps.time_test.outputs.end }}

          BUILD_S: ${{ steps.time_build.outputs.start }}
          BUILD_E: ${{ steps.time_build.outputs.end }}
        run: |
          set -euo pipefail

          [ -z "${WEBHOOK:-}" ] && echo "⚠️ DISCORD_WEBHOOK_URL이 공백이므로 본 단계를 스킵합니다." && exit 0

          # 안전한 산술 계산용 함수
          dur() { local s="${1:-}" e="${2:-}"; [ -n "$s" ] && [ -n "$e" ] && echo $((e - s)) || echo 0; }

          ci_total="$(dur "$CI_START" "$CI_END")"
          test_sec="$(dur "$TEST_S" "$TEST_E")"
          build_sec="$(dur "$BUILD_S" "$BUILD_E")"

          TIMESTAMP="${TIMESTAMP:-$(date -u +%FT%TZ)}"

          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ [BE / ${ENV_NAME}] CI Success"
            COLOR=5763719
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            TITLE="⚠️ [BE / ${ENV_NAME}] CI Cancelled"
            COLOR=16776988
          elif [ "$JOB_STATUS" = "skipped" ]; then
            TITLE="⏭️ [BE / ${ENV_NAME}] CI Skipped"
            COLOR=9807270
          else
            TITLE="❌ [BE / ${ENV_NAME}] CI Failed"
            COLOR=15548997
          fi

          # 개행 문자 및 따옴표 제거, 200자로 자름
          safe_msg=$(echo "$MESSAGE" | tr '\n' ' ' | sed 's/"/\\"/g' | head -c 200)

          JSON_PAYLOAD=$(cat <<JSON
          {
            "embeds": [
              {
                "title": "$TITLE",
                "url": "$RUN_URL",
                "color": $COLOR,
                "description": "${safe_msg}",
                "fields": [
                  {"name":"Release ID","value":"\`${RELEASE_ID}\`","inline":false},

                  {"name":"Actor","value":"${ACTOR}","inline":true},
                  {"name":"Branch","value":"${BRANCH}","inline":true},
                  {"name": "Event Name","value":"${EVENT_NAME}","inline":true},

                  {"name":"Total CI","value":"${ci_total}s","inline":true},
                  {"name":"Test","value":"${test_sec}s","inline":true},
                  {"name":"Build","value":"${build_sec}s","inline":true}
                ],
                "timestamp": "$TIMESTAMP"
              }
            ]
          }
          JSON
          )

          curl -sS -X POST -H "Content-Type: application/json" --data-binary "$JSON_PAYLOAD" "$WEBHOOK" || true

  cd:
    name: CD
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10

    # push일 때만 배포
    if: github.event_name == 'push'

    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      MANIFEST_REPO: ${{ secrets.MANIFEST_REPO }}
      MANIFEST_BRANCH: ${{ secrets.MANIFEST_BRANCH }}
      MANIFEST_PATH: ${{ vars.MANIFEST_PATH }}

    steps:
      - name: Checkout manifest repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          ref: ${{ env.MANIFEST_BRANCH }}
          ssh-key: ${{ secrets.DAENG_MAP_DEPLOY_KEY }}
          path: manifest

      - name: Update image tag
        run: |
          cd manifest
          sed -i "s|tag:.*|tag: \"${{ env.RELEASE_ID }}\"|" ${{ env.MANIFEST_PATH }}
          echo "Updated image tag to: ${{ env.RELEASE_ID }}"
          grep "tag:" ${{ env.MANIFEST_PATH }}

      - name: Commit & push
        id: deploy
        run: |
          cd manifest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.MANIFEST_PATH }}
          git commit -m "deploy: be image ${{ env.RELEASE_ID }}"
          git push
